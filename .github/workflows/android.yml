name: Build Android APK

on:
  push:
    branches: [ main ]
    paths:
      - "app/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licences and install platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download PicoDrive core (arm64)
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64/picodrive_libretro_android.so.zip" -o /tmp/picodrive.zip
          unzip -o /tmp/picodrive.zip -d /tmp/picodrive
          CORE="$(find /tmp/picodrive -type f -name '*.so' | head -n 1)"
          test -n "$CORE"
          cp "$CORE" app/src/main/jniLibs/arm64-v8a/libpicodrive_libretro_android.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MECH-BATTLE-Mobile-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
