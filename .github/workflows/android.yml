name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download PicoDrive core for arm64-v8a
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/picodrive_libretro_android.so.zip" -o /tmp/picodrive.zip
          unzip -l /tmp/picodrive.zip
          unzip -o /tmp/picodrive.zip -d /tmp/picodrive
          CORE="$(find /tmp/picodrive -type f -name 'picodrive_libretro_android.so' | head -n 1)"
          test -n "$CORE"
          install -m 0644 "$CORE" app/src/main/jniLibs/arm64-v8a/libpicodrive_libretro_android.so
          file app/src/main/jniLibs/arm64-v8a/libpicodrive_libretro_android.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MECH-BATTLE-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
