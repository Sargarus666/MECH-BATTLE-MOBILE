name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive

      - name: Verify pinned static recompiler source
        run: |
          test "$(git -C third_party/segarecomp rev-parse HEAD)" = "8d419ab029c2222ab6b699b516c6fee53bac650c"
          grep -q "Mozilla Public License Version 2.0" third_party/segarecomp/LICENSE

      - name: Build upstream Genesis C11 runtime libraries (host portability smoke test)
        run: |
          cmake --version
          cmake -S third_party/segarecomp -B /tmp/segarecomp-build -G Ninja \
            -DBUILD_TESTING=OFF \
            -DSEGARECOMP_ENABLE_SDL3_VIEWER=OFF \
            -DSEGARECOMP_BUILD_LAUNCHER=OFF
          cmake --build /tmp/segarecomp-build --target \
            segarecomp_runtime_genesis \
            segarecomp_runtime_genesis_z80 \
            segarecomp_runtime_genesis_audio

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: "true"
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"

      - name: Locate Android NDK and CMake toolchain
        run: |
          NDK_TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$NDK_TOOLCHAIN"
          echo "ANDROID_NDK_TOOLCHAIN=$NDK_TOOLCHAIN" >> "$GITHUB_ENV"
          cmake --version
          "$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" --version

      - name: Cross-compile Genesis C11 runtime with Android NDK (arm64-v8a)
        run: |
          cmake -S third_party/segarecomp -B /tmp/segarecomp-android -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_TOOLCHAIN" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DBUILD_TESTING=OFF \
            -DSEGARECOMP_ENABLE_SDL3_VIEWER=OFF \
            -DSEGARECOMP_BUILD_LAUNCHER=OFF
          cmake --build /tmp/segarecomp-android --target \
            segarecomp_runtime_genesis \
            segarecomp_runtime_genesis_z80 \
            segarecomp_runtime_genesis_audio

      - name: Run ROM-independent tooling tests
        run: |
          python3 --version
          python3 -m unittest discover -s tools/tests -v

      - name: Download PicoDrive core for arm64-v8a
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/picodrive_libretro_android.so.zip" -o /tmp/picodrive.zip
          unzip -l /tmp/picodrive.zip
          unzip -o /tmp/picodrive.zip -d /tmp/picodrive
          CORE="$(find /tmp/picodrive -type f -name 'picodrive_libretro_android.so' | head -n 1)"
          test -n "$CORE"
          install -m 0644 "$CORE" app/src/main/jniLibs/arm64-v8a/libpicodrive_libretro_android.so
          file app/src/main/jniLibs/arm64-v8a/libpicodrive_libretro_android.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean assembleDebug

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          grep -q "package: name='com.sargarus.mechbattle'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'23'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/apk-badging.txt
          grep -q "native-code: 'arm64-v8a'" /tmp/apk-badging.txt
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MECH-BATTLE-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
