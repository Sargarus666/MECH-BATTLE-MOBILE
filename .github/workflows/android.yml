name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: recursive
      - name: Verify pinned static recompiler source
        run: |
          test "$(git -C third_party/segarecomp rev-parse HEAD)" = "8d419ab029c2222ab6b699b516c6fee53bac650c"
          grep -q "Mozilla Public License Version 2.0" third_party/segarecomp/LICENSE
      - name: Build upstream Genesis C11 runtime libraries (host portability smoke test)
        run: |
          cmake -S third_party/segarecomp -B /tmp/segarecomp-build -G Ninja -DBUILD_TESTING=OFF -DSEGARECOMP_ENABLE_SDL3_VIEWER=OFF -DSEGARECOMP_BUILD_LAUNCHER=OFF
          cmake --build /tmp/segarecomp-build --target segarecomp_runtime_genesis segarecomp_runtime_genesis_z80 segarecomp_runtime_genesis_audio
      - name: Build and smoke-test the pinned static recompiler CLI
        run: |
          cmake --build /tmp/segarecomp-build --target segarecomp --parallel 2
          CLI="$(find /tmp/segarecomp-build -type f -name segarecomp -perm -u+x -print -quit)"
          test -n "$CLI"
          "$CLI" probe-genesis-startup-decode 4E71 - | tee /tmp/segarecomp-decode-smoke.json
          grep -q '"decoded":true' /tmp/segarecomp-decode-smoke.json
          grep -q '"support":"supported"' /tmp/segarecomp-decode-smoke.json
          python3 - <<'PY'
          import struct
          from pathlib import Path

          rom = bytearray(0x400)
          struct.pack_into(">I", rom, 0x00, 0x00FFFFFC)
          struct.pack_into(">I", rom, 0x04, 0x00000200)
          rom[0x100:0x110] = b"SEGA GENESIS    "
          rom[0x110:0x120] = b"(C)CI FIXTURE   "
          rom[0x120:0x150] = b"CI RECOMP TEST".ljust(48, b" ")
          rom[0x150:0x180] = b"CI RECOMP TEST".ljust(48, b" ")
          rom[0x180:0x18E] = b"GM CI-TEST-00".ljust(14, b" ")
          struct.pack_into(">I", rom, 0x1A0, 0)
          struct.pack_into(">I", rom, 0x1A4, len(rom) - 1)
          struct.pack_into(">I", rom, 0x1A8, 0x00FF0000)
          struct.pack_into(">I", rom, 0x1AC, 0x00FFFFFF)
          rom[0x1F0:0x1F3] = b"U  "
          rom[0x200:0x206] = bytes.fromhex("7000524060FA")
          checksum = sum(
              int.from_bytes(rom[offset:offset + 2], "big")
              for offset in range(0x200, len(rom), 2)
          ) & 0xFFFF
          struct.pack_into(">H", rom, 0x18E, checksum)
          Path("/tmp/segarecomp-smoke.gen").write_bytes(rom)
          PY
          "$CLI" genesis-general-startup /tmp/segarecomp-smoke.gen | tee /tmp/segarecomp-general-startup-smoke.txt
          test -s /tmp/segarecomp-general-startup-smoke.txt
          mkdir -p /tmp/segarecomp-cli-artifact
          install -m 0755 "$CLI" /tmp/segarecomp-cli-artifact/segarecomp
          cp third_party/segarecomp/LICENSE /tmp/segarecomp-cli-artifact/LICENSE
          printf '%s\n' 'Upstream: https://github.com/marinocg/segarecomp' 'Pinned source commit: 8d419ab029c2222ab6b699b516c6fee53bac650c' 'License: MPL-2.0' 'This artifact contains the CLI only; no ROM, BIOS, generated game code, or game assets.' > /tmp/segarecomp-cli-artifact/SOURCE.txt
          sha256sum /tmp/segarecomp-cli-artifact/segarecomp
      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          cmdline-tools-version: "15859902"
          accept-android-sdk-licenses: "true"
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - name: Locate Android NDK and CMake toolchain
        run: |
          NDK_TOOLCHAIN="$ANDROID_HOME/ndk/27.2.12479018/build/cmake/android.toolchain.cmake"
          test -f "$NDK_TOOLCHAIN"
          echo "ANDROID_NDK_TOOLCHAIN=$NDK_TOOLCHAIN" >> "$GITHUB_ENV"
          cmake --version
      - name: Cross-compile Genesis C11 runtime with Android NDK (arm64-v8a)
        run: |
          cmake -S third_party/segarecomp -B /tmp/segarecomp-android-arm64 -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_TOOLCHAIN" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-23 -DBUILD_TESTING=OFF -DSEGARECOMP_ENABLE_SDL3_VIEWER=OFF -DSEGARECOMP_BUILD_LAUNCHER=OFF
          cmake --build /tmp/segarecomp-android-arm64 --target segarecomp_runtime_genesis segarecomp_runtime_genesis_z80 segarecomp_runtime_genesis_audio
      - name: Cross-compile Genesis C11 runtime with Android NDK (x86_64 emulator)
        run: |
          cmake -S third_party/segarecomp -B /tmp/segarecomp-android-x86_64 -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_TOOLCHAIN" -DANDROID_ABI=x86_64 -DANDROID_PLATFORM=android-23 -DBUILD_TESTING=OFF -DSEGARECOMP_ENABLE_SDL3_VIEWER=OFF -DSEGARECOMP_BUILD_LAUNCHER=OFF
          cmake --build /tmp/segarecomp-android-x86_64 --target segarecomp_runtime_genesis segarecomp_runtime_genesis_z80 segarecomp_runtime_genesis_audio
      - name: Run ROM-independent tooling tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Download PicoDrive cores for arm64-v8a and x86_64
        run: |
          for ABI in arm64-v8a x86_64; do
            mkdir -p "app/src/main/jniLibs/$ABI" "/tmp/picodrive-$ABI"
            curl --retry 3 --retry-delay 2 -fL "https://buildbot.libretro.com/nightly/android/latest/$ABI/picodrive_libretro_android.so.zip" -o "/tmp/picodrive-$ABI.zip"
            unzip -l "/tmp/picodrive-$ABI.zip"
            unzip -o "/tmp/picodrive-$ABI.zip" -d "/tmp/picodrive-$ABI"
            CORE="$(find "/tmp/picodrive-$ABI" -type f -name 'picodrive_libretro_android.so' | head -n 1)"
            test -n "$CORE"
            install -m 0644 "$CORE" "app/src/main/jniLibs/$ABI/libpicodrive_libretro_android.so"
          done
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest assembleDebug
      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" > /tmp/apk-badging.txt
          grep -q "package: name='com.sargarus.mechbattle'" /tmp/apk-badging.txt
          grep -q "sdkVersion:'23'" /tmp/apk-badging.txt
          grep -q "targetSdkVersion:'35'" /tmp/apk-badging.txt
          grep -q "native-code:.*arm64-v8a.*x86_64" /tmp/apk-badging.txt
          sha256sum "$APK"
      - name: Install and launch on Android 15 emulator
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.sargarus.mechbattle/.MainActivity
            sleep 8
            adb shell pidof com.sargarus.mechbattle
            adb logcat -d -t 3000 > /tmp/mech-battle-logcat.txt
            if grep -E "FATAL EXCEPTION|Fatal signal|UnsatisfiedLinkError" /tmp/mech-battle-logcat.txt; then exit 1; fi
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MECH-BATTLE-Mobile-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload static recompiler CLI for private analysis
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: segarecomp-cli-linux-x86_64
          path: /tmp/segarecomp-cli-artifact/
          if-no-files-found: error
          retention-days: 14
